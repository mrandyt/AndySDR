# Builds AndySDR.exe on a Windows machine in the cloud every time you push to GitHub.
# Download the result from the Actions tab (artifact "AndySDR-windows").
# Push a tag such as v1.0.0 to also publish a GitHub Release with the zip + installer.
name: Build AndySDR for Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

# Needed so a version tag (v1.0.0 etc.) can publish a GitHub Release with the installer
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: andysdr
          python-version: "3.11"
          channels: conda-forge

      - name: Install SDR libraries
        run: |
          conda install -y numpy scipy soapysdr
          for m in soapysdr-module-rtlsdr soapysdr-module-airspy soapysdr-module-airspyhf soapysdr-module-hackrf soapysdr-module-remote soapysdr-module-lms7 soapysdr-module-plutosdr; do
            conda install -y "$m" || echo "skipped $m"
          done
          python -m pip install pywebview pyinstaller
          python -c "import SoapySDR; print('SoapySDR', SoapySDR.getAPIVersion(), SoapySDR.listModules())"
          # RTL-SDR (Nooelec etc.) support is essential - fail the build if its driver module is missing
          python -c "import SoapySDR,sys; m=[x.lower() for x in SoapySDR.listModules()]; ok=any('rtlsdr' in x for x in m); print('RTL-SDR module present:', ok); sys.exit(0 if ok else 1)"

      - name: Build AndySDR.exe
        run: |
          pyinstaller --noconfirm AndySDR.spec
          ls dist/AndySDR/_internal/soapy/lib/SoapySDR/*/ | tee /dev/stderr | grep -qi rtlsdr && echo "RTL-SDR driver bundled in the exe"
          mkdir -p dist/AndySDR/decoders
          cp decoders_README.txt dist/AndySDR/decoders/README.txt
          cp README.md dist/AndySDR/
          cp -r samples dist/AndySDR/

      - name: Bundle decoder programs (DSD-FME, multimon-ng, SatDump)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=dist/AndySDR/decoders
          # fails the build if any decoder is missing, so a release never ships without them
          python -m andysdr.fetchdecoders "$D" --require dsd-fme,multimon-ng,satdump
          # Visual C++ runtime next to SatDump (Microsoft's app-local deployment) so it runs on a clean PC
          SD=$(dirname "$(find "$D" -iname satdump.exe | head -1)" 2>/dev/null || true)
          if [ -n "$SD" ] && [ -d "$SD" ]; then
            for f in msvcp140.dll msvcp140_1.dll msvcp140_2.dll vcruntime140.dll vcruntime140_1.dll concrt140.dll vcomp140.dll; do
              [ -f "$SD/$f" ] || cp "/c/Windows/System32/$f" "$SD/" 2>/dev/null || true
            done
          fi
          echo "== Decoders bundled:"
          missing=0
          for e in dsd-fme multimon-ng satdump; do
            p=$(find "$D" -iname "$e.exe" | head -1)
            if [ -n "$p" ]; then echo "::notice::Bundled $e -> $p"; else echo "::error::$e.exe could not be bundled"; missing=1; fi
          done
          du -sh "$D"
          exit $missing

      - name: Visual C++ runtime for the installer
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force redist | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile redist/vc_redist.x64.exe

      - name: Smoke test (start the server, fetch the GUI)
        run: |
          ./dist/AndySDR/AndySDR.exe --server --port 8099 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/ -o /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8099/ | grep -q AndySDR && echo "GUI served OK"
          taskkill //IM AndySDR.exe //F || true

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/AndySDR -DestinationPath AndySDR-windows.zip

      - name: Installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AndySDR-windows
          path: |
            AndySDR-windows.zip
            Output/AndySDR-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AndySDR-windows.zip
            Output/AndySDR-Setup.exe
