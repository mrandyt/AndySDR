# Builds AndySDR.exe on a Windows machine in the cloud every time you push to GitHub.
# Download the result from the Actions tab (artifact "AndySDR-windows").
# Push a tag such as v1.0.0 to also publish a GitHub Release with the zip + installer.
name: Build AndySDR for Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

# Needed so a version tag (v1.0.0 etc.) can publish a GitHub Release with the installer
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: andysdr
          python-version: "3.11"
          channels: conda-forge

      - name: Install SDR libraries
        run: |
          conda install -y numpy scipy soapysdr
          for m in soapysdr-module-rtlsdr soapysdr-module-airspy soapysdr-module-airspyhf soapysdr-module-hackrf soapysdr-module-remote soapysdr-module-lms7 soapysdr-module-plutosdr; do
            conda install -y "$m" || echo "skipped $m"
          done
          python -m pip install pywebview pyinstaller meshcore pyserial bleak sgp4 certifi
          python -c "import meshcore, serial, bleak; print(\"MeshCore library\", meshcore.__name__, \"OK\")"
          python -c "import SoapySDR; print('SoapySDR', SoapySDR.getAPIVersion(), SoapySDR.listModules())"
          # RTL-SDR (Nooelec etc.) support is essential - fail the build if its driver module is missing
          python -c "import SoapySDR,sys; m=[x.lower() for x in SoapySDR.listModules()]; ok=any('rtlsdr' in x for x in m); print('RTL-SDR module present:', ok); sys.exit(0 if ok else 1)"

      - name: ADS-B decoder self-test (informational)
        continue-on-error: true
        run: python tests/test_adsb.py

      - name: Updater self-test (informational)
        continue-on-error: true
        run: python tests/test_updater.py

      - name: Lockout self-test (informational)
        continue-on-error: true
        run: python tests/test_lockout.py

      - name: New-feature self-tests (informational)
        continue-on-error: true
        run: |
          for t in test_aircraftinfo test_satpass test_satsched test_ft8 test_dab test_bandwidth; do python tests/$t.py || echo "::warning::$t failed"; done

      - name: Build AndySDR.exe
        run: |
          pyinstaller --noconfirm AndySDR.spec
          ls dist/AndySDR/_internal/soapy/lib/SoapySDR/*/ | tee /dev/stderr | grep -qi rtlsdr && echo "RTL-SDR driver bundled in the exe"
          # AndySDR drives RTL dongles (Nooelec NESDR etc.) directly through librtlsdr - it must be in the exe
          f=$(ls dist/AndySDR/_internal/soapy/bin/ | grep -iE '^(lib)?rtlsdr\.dll$' | head -1)
          if [ -n "$f" ]; then echo "::notice::RTL-SDR library bundled: $f"; else echo "::error::rtlsdr.dll missing"; exit 1; fi
          mkdir -p dist/AndySDR/decoders
          cp decoders_README.txt dist/AndySDR/decoders/README.txt
          cp README.md dist/AndySDR/
          cp -r samples dist/AndySDR/

      - name: Bundle decoder programs (DSD-FME, multimon-ng, SatDump)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=dist/AndySDR/decoders
          # fails the build if any decoder is missing, so a release never ships without them
          python -m andysdr.fetchdecoders "$D" --require dsd-fme,multimon-ng,satdump
          # Visual C++ runtime next to SatDump (Microsoft's app-local deployment) so it runs on a clean PC
          SD=$(dirname "$(find "$D" -iname satdump.exe | head -1)" 2>/dev/null || true)
          if [ -n "$SD" ] && [ -d "$SD" ]; then
            for f in msvcp140.dll msvcp140_1.dll msvcp140_2.dll vcruntime140.dll vcruntime140_1.dll concrt140.dll vcomp140.dll; do
              [ -f "$SD/$f" ] || cp "/c/Windows/System32/$f" "$SD/" 2>/dev/null || true
            done
          fi
          echo "== Decoders bundled:"
          missing=0
          for e in dsd-fme multimon-ng satdump; do
            p=$(find "$D" -iname "$e.exe" | head -1)
            if [ -n "$p" ]; then echo "::notice::Bundled $e -> $p"; else echo "::error::$e.exe could not be bundled"; missing=1; fi
          done
          du -sh "$D"
          exit $missing

      - name: Build FT8/FT4 decoder (ft8_lib, MIT)
        continue-on-error: true            # a build problem must not block the release; the app then says decode_ft8 is missing
        shell: bash
        run: |
          D=dist/AndySDR/decoders/ft8_lib
          mkdir -p "$D"
          git clone --depth 1 https://github.com/kgoba/ft8_lib.git /tmp/ft8_lib
          cd /tmp/ft8_lib
          git rev-parse HEAD
          # MinGW has no stpcpy(); provide one through a force-included shim
          printf '#include <string.h>\n#define stpcpy andysdr_stpcpy\nstatic inline char *andysdr_stpcpy(char *d, const char *s) { size_t n = strlen(s); memcpy(d, s, n + 1); return d + n; }\n' > /tmp/stpcpy_shim.h
          gcc -O3 -include /tmp/stpcpy_shim.h -I. -static -o decode_ft8.exe demo/decode_ft8.c ft8/*.c common/wave.c common/monitor.c common/audio.c fft/*.c -lm
          cp decode_ft8.exe "$OLDPWD/$D/"
          cp LICENSE "$OLDPWD/$D/LICENSE.txt"
          echo "ft8_lib $(git rev-parse HEAD) https://github.com/kgoba/ft8_lib (MIT)" > "$OLDPWD/$D/ANDYSDR_SOURCE.txt"
          cd "$OLDPWD"
          ls -l "$D"
          # decode an empty slot to prove it starts (prints nothing, exits 0)
          python - <<'PY'
          import wave, subprocess
          w = wave.open("silence.wav", "wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(12000); w.writeframes(b"\0\0" * 12000 * 15); w.close()
          r = subprocess.run(["dist/AndySDR/decoders/ft8_lib/decode_ft8.exe", "silence.wav"], capture_output=True, timeout=60)
          print("decode_ft8 exit", r.returncode, r.stdout[:200], r.stderr[:300])
          PY

      - name: Build DAB decoder (welle-cli from source, experimental)
        continue-on-error: true            # welle.io stopped publishing a Windows welle-cli; if this fails the DAB tab says the decoder is missing
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-faad2
            mingw-w64-x86_64-mpg123
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-pkg-config
            vim
      - name: Compile and bundle welle-cli
        continue-on-error: true
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/AlbrechtL/welle.io.git /tmp/welle.io
          cd /tmp/welle.io
          git rev-parse HEAD
          mkdir build && cd build
          cmake .. -G Ninja -DBUILD_WELLE_IO=OFF -DBUILD_WELLE_CLI=ON -DRTLSDR=OFF -DSOAPYSDR=OFF -DAIRSPY=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_STANDARD_LIBRARIES="-lws2_32 -lmswsock"
          ninja welle-cli
          D="$GITHUB_WORKSPACE/dist/AndySDR/decoders/welle-cli"
          mkdir -p "$D"
          cp welle-cli.exe "$D/"
          # copy the MinGW DLLs it needs next to it
          ldd welle-cli.exe | awk '/mingw64/ {print $3}' | xargs -I{} cp {} "$D/"
          cp ../LICENSE "$D/LICENSE.txt" 2>/dev/null || true
          echo "welle.io $(cd .. && git rev-parse HEAD) https://github.com/AlbrechtL/welle.io (GPL-2.0)" > "$D/ANDYSDR_SOURCE.txt"
          ls -l "$D"

      - name: Visual C++ runtime for the installer
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force redist | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile redist/vc_redist.x64.exe

      - name: Smoke test (start the server, fetch the GUI)
        run: |
          ./dist/AndySDR/AndySDR.exe --server --port 8099 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/ -o /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8099/ | grep -q AndySDR && echo "GUI served OK"
          # MeshCore messaging must be inside the exe
          LOG="$(cygpath -u "$APPDATA")/AndySDR/logs/andysdr.log"
          grep -h "MeshCore library" "$LOG" || true
          if grep -q "MeshCore library: OK" "$LOG"; then echo "::notice::MeshCore library bundled"; else echo "::error::MeshCore library missing from the exe"; taskkill //IM AndySDR.exe //F || true; exit 1; fi
          taskkill //IM AndySDR.exe //F || true

      - name: Read version
        id: ver
        run: echo "v=$(python -c "from andysdr.config import VERSION; print(VERSION)")" >> "$GITHUB_OUTPUT"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/AndySDR -DestinationPath AndySDR-windows.zip

      - name: Installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=${{ steps.ver.outputs.v }}" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AndySDR-windows
          path: |
            AndySDR-windows.zip
            Output/AndySDR-Setup.exe

      # Every build of main publishes (or refreshes) the GitHub Release for the program's version,
      # e.g. v1.2.0, with the zip and the installer attached.
      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: AndySDR ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **AndySDR ${{ steps.ver.outputs.v }} for Windows 10/11**

            * `AndySDR-Setup.exe` – installer (Start menu + desktop shortcut, firewall rule for remote use, Visual C++ runtime)
            * `AndySDR-windows.zip` – portable: unzip and run `AndySDR.exe`

            Decoders bundled in the `decoders` folder: DSD-FME (DMR, P25, NXDN, dPMR, YSF, M17), multimon-ng (POCSAG, FLEX, APRS, DTMF, ZVEI, EAS), SatDump (Meteor-M LRPT). WEFAX and SSTV are built in.
            1.9.0: MeshCore with just an SDR - a receive-only LoRa decoder in the MESHCORE tab lists repeaters, room servers, companions and sensors from their adverts (with positions) and reads public / #hashtag channel messages, plus a live packet log. No LoRa board needed (experimental; nothing is transmitted).
            1.8.0: new FILES buttons under the display open the weather-images folder and the sound-recordings folder; satellite auto-capture now has Mon–Sun day boxes (no times needed - captures start only when the satellite is over you); ADS-B aircraft panel shows far more: origin/destination cities, distance to go and rough arrival time, plain-English category, flight phase, squawk meaning, military flag, owner country and session peaks.
            1.7.0: new WIDTH drop-down for the receive bandwidth, with the usual widths for each mode and an automatic ★ suggestion (from the running decoder, Auto ID and the band plan).
            1.6.1: update check no longer fails on PCs whose certificate store can't verify GitHub (falls back to a bundled CA list), and
            the error message now says why it failed (certificate, DNS, timeout, firewall).
            1.6.0: SDR++ style theme; satellite auto-capture (ISS SSTV, Meteor-M N2-3/N2-4 LRPT, GOES HRIT) from live pass predictions; aircraft registry/type/owner/photo lookup and a bright map in the ADS-B tab; FT8/FT4 decoder that starts itself on band-plan channels; experimental DAB radio tab. NOAA APT removed from the docs (retired).
            1.5.1: fuller front panel - status strip (clocks, receiver, span, filter, scan state, decoder) across the top, RX/SCAN/DEC/REC/LINK lights, and quick buttons under the display for mode, UK bands, decoders and audio. New SKIP buttons ignore a scanned channel or searched frequency for 10 minutes, 1 hour or the day (UNSKIP undoes it; key I). Band plan is bigger: Medium and Large enlarged with bigger text, new Extra large size.
            1.5.0: AndySDR can now update itself - it checks GitHub for new releases, shows a pop-up with what is new and, if you agree, downloads, checks and installs the update and restarts (REMOTE & SETTINGS › Updates).
            1.4.0: ADS-B aircraft tracking tab (1090 MHz) with live table and map.
            1.3.1: new PAGER MESSAGES tab - POCSAG/FLEX pages in a searchable table (time, frequency, capcode, name, type, message), capcode names and highlights with pop-up notices, CSV export, daily logs in %APPDATA%\AndySDR\pager.
            1.3.0: MeshCore messaging tab – chat over the MeshCore LoRa mesh through a companion board on USB, Wi-Fi or Bluetooth.
            1.2.1: RTL-SDR dongles (Nooelec NESDR SMArt v5 etc.) now open directly through librtlsdr - fixes "SoapySDR::Device::make() no match". Smaller LCD on every scanner style.

            SDRplay RSP users: install SDRplay API 3.x from sdrplay.com first. RTL-SDR / Nooelec: install WinUSB once with Zadig.
          files: |
            AndySDR-windows.zip
            Output/AndySDR-Setup.exe
