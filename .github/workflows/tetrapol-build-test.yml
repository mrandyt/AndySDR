# Quick check of the Tetrapol-kit Windows build only (scratch branch; not part of the release workflow).
name: Tetrapol build check
on:
  push:
    branches: [tetrapol-build-test]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkgconf
      - name: Build tetrapol_dump
        shell: msys2 {0}
        run: |
          TK=9bfb9f80347f30f43d25fe38325c11de145359d9
          git init -q /tmp/tetrapol-kit && cd /tmp/tetrapol-kit && git fetch -q --depth 1 https://github.com/jswo/tetrapol-kit.git $TK && git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          D="$GITHUB_WORKSPACE/dist/tetrapol"
          bash decoders_src/tetrapol/build.sh /tmp/tetrapol-kit "$D" gcc
          ldd "$D/tetrapol_dump.exe" | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do cp "$dll" "$D/"; done
          ls -l "$D"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run it on a generated Tetrapol bit stream
        shell: bash
        run: |
          python -m pip install numpy scipy
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, ".")
          import numpy as np
          from andysdr import tetrapol
          bits = tetrapol.make_frames(300, seed=7)
          iq = tetrapol.modulate(bits, cfo=300)
          d = tetrapol.TetrapolDemod(48000.0)
          rx = np.concatenate([d.process(iq[i:i + 2400]) for i in range(0, len(iq), 2400)])
          print("demod synced:", d.synced, "frames:", d.sync_frames, "bits:", len(rx))
          pr = subprocess.run(["dist/tetrapol/tetrapol_dump.exe", "-i", "-", "-b", "UHF", "-t", "CCH", "-d", "DOWN"],
                              input=rx.tobytes(), capture_output=True, timeout=60)
          out = (pr.stdout + pr.stderr).decode("latin1")
          print("exit code:", pr.returncode)
          print(out[-1500:])
          sys.exit(0 if pr.returncode in (0, 1) else 1)
          PY
